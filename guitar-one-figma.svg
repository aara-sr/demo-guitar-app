<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="4500" viewBox="0 0 1320 4500">
  <title>Guitar One editable Figma screens</title>
  <desc>Native SVG design board. Import this file into Figma, then ungroup each screen to edit layers.</desc>
  <defs>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#86a18e"/><stop offset="1" stop-color="#244a3c"/></linearGradient>
    <linearGradient id="live" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b4c4b4"/><stop offset=".7" stop-color="#64806d"/><stop offset="1" stop-color="#244a3c"/></linearGradient>
    <style>
      .label{font:600 14px Arial,sans-serif;fill:#18372d}.title{font:700 34px Arial,sans-serif;fill:#18372d}.h2{font:700 22px Arial,sans-serif;fill:#18372d}.body{font:400 17px Arial,sans-serif;fill:#18372d}.small{font:400 13px Arial,sans-serif;fill:#68706b}.button{font:700 16px Arial,sans-serif;fill:#f7f5ef}.center{text-anchor:middle}.white{fill:#f7f5ef}.forest{fill:#244a3c}.muted{fill:#68706b}.danger{fill:#c9352d}
    </style>
  </defs>
  <rect width="1320" height="4500" fill="#dfe3dd"/>
  <text x="48" y="50" class="title">Guitar One / Editable Figma screens</text>
  <text x="48" y="78" class="small">Native SVG layers. Import this file into Figma, select a screen group, and ungroup to edit.</text>

  <!-- 01 First launch -->
  <g id="screen-01-first-launch" transform="translate(40 110)">
    <text x="0" y="-18" class="label">01 / First launch</text><rect width="402" height="874" rx="48" fill="#f7f5ef" stroke="#9da59d" stroke-width="2"/><rect x="138" y="12" width="126" height="36" rx="20" fill="#111"/><text x="30" y="32" class="label">9:41</text><text x="310" y="32" class="label">▮▮▮ ◔ ▰</text>
    <rect x="160" y="184" width="82" height="82" rx="23" fill="#244a3c"/><text x="201" y="239" class="title center white">?</text><text x="201" y="314" class="title center">Guitar One</text><text x="201" y="355" class="body center">Your AI guitar tutor for beginners.</text><text x="201" y="384" class="small center">Learn chords, build confidence, and make music.</text><rect x="16" y="790" width="370" height="56" rx="14" fill="#244a3c"/><text x="201" y="825" class="button center">Get Started</text><rect x="134" y="854" width="135" height="5" rx="3" fill="#18372d"/>
  </g>

  <!-- 02 Permissions -->
  <g id="screen-02-permissions" transform="translate(460 110)">
    <text x="0" y="-18" class="label">02 / Permissions</text><rect width="402" height="874" rx="48" fill="#f7f5ef" stroke="#9da59d" stroke-width="2"/><rect x="138" y="12" width="126" height="36" rx="20" fill="#111"/><text x="30" y="32" class="label">9:41</text><text x="310" y="32" class="label">▮▮▮ ◔ ▰</text><text x="16" y="120" class="title">Allow Access</text>
    <rect x="16" y="150" width="370" height="72" rx="18" fill="#fffdf8"/><rect x="32" y="166" width="40" height="40" rx="12" fill="#ebe9e2"/><text x="52" y="194" class="h2 center forest">⌁</text><text x="88" y="185" class="body">Camera</text><text x="88" y="207" class="small">To see your guitar and hands</text><text x="360" y="194" class="h2 center muted">›</text>
    <rect x="16" y="230" width="370" height="72" rx="18" fill="#fffdf8"/><rect x="32" y="246" width="40" height="40" rx="12" fill="#ebe9e2"/><text x="52" y="274" class="h2 center forest">◉</text><text x="88" y="265" class="body">Microphone</text><text x="88" y="287" class="small">To hear your chords</text><text x="360" y="274" class="h2 center muted">›</text>
    <rect x="16" y="318" width="370" height="74" rx="18" fill="#fffdf8"/><text x="32" y="347" class="small">▣ Everything from your camera and microphone</text><text x="32" y="368" class="small">stays on your device. Nothing is used by us.</text><rect x="16" y="790" width="370" height="56" rx="14" fill="#244a3c"/><text x="201" y="825" class="button center">Continue</text><rect x="134" y="854" width="135" height="5" rx="3" fill="#18372d"/>
  </g>

  <!-- 03 Blocked -->
  <g id="screen-03-blocked" transform="translate(880 110)">
    <text x="0" y="-18" class="label">03 / Access blocked</text><rect width="402" height="874" rx="48" fill="#f7f5ef" stroke="#9da59d" stroke-width="2"/><rect x="138" y="12" width="126" height="36" rx="20" fill="#111"/><text x="201" y="330" class="title center">▣</text><text x="201" y="390" class="h2 center">Access Needed</text><text x="201" y="430" class="body center">Camera and microphone access are</text><text x="201" y="454" class="body center">needed to check your guitar and hear chords.</text><rect x="16" y="500" width="370" height="56" rx="14" fill="#244a3c"/><text x="201" y="535" class="button center">Open Settings</text><rect x="16" y="568" width="370" height="56" rx="14" fill="#ebe9e2"/><text x="201" y="603" class="label center">Try Again</text><rect x="134" y="854" width="135" height="5" rx="3" fill="#18372d"/>
  </g>

  <!-- 04 Practice -->
  <g id="screen-04-practice" transform="translate(40 1080)">
    <text x="0" y="-18" class="label">04 / Practice</text><rect width="402" height="874" rx="48" fill="#f7f5ef" stroke="#9da59d" stroke-width="2"/><rect x="138" y="12" width="126" height="36" rx="20" fill="#111"/><text x="30" y="32" class="label">9:41</text><text x="310" y="32" class="label">▮▮▮ ◔ ▰</text><text x="16" y="120" class="title">Practice</text><rect x="16" y="150" width="370" height="72" rx="18" fill="#fffdf8"/><rect x="32" y="166" width="40" height="40" rx="12" fill="#ebe9e2"/><text x="52" y="194" class="h2 center forest">♮</text><text x="88" y="185" class="body">Tune guitar?</text><text x="88" y="207" class="small">Get in tune before you start</text><text x="350" y="194" class="h2 center muted">× ›</text><text x="16" y="260" class="label">Choose a chord</text>
    <g fill="#fffdf8"><rect x="16" y="280" width="179" height="144" rx="18"/><rect x="207" y="280" width="179" height="144" rx="18"/><rect x="16" y="436" width="179" height="144" rx="18"/><rect x="207" y="436" width="179" height="144" rx="18"/></g><g class="h2"><text x="32" y="320">C</text><text x="223" y="320">D</text><text x="32" y="476">G</text><text x="223" y="476">Em</text></g><g class="small"><text x="32" y="405">Practice chord</text><text x="223" y="405">Practice chord</text><text x="32" y="561">Practice chord</text><text x="223" y="561">Practice chord</text></g><use href="#tabs-practice"/>
  </g>

  <!-- 05 Dashboard -->
  <g id="screen-05-dashboard" transform="translate(460 1080)">
    <text x="0" y="-18" class="label">05 / Dashboard</text><rect width="402" height="874" rx="48" fill="#f7f5ef" stroke="#9da59d" stroke-width="2"/><rect x="138" y="12" width="126" height="36" rx="20" fill="#111"/><text x="30" y="32" class="label">9:41</text><text x="310" y="32" class="label">▮▮▮ ◔ ▰</text><rect x="16" y="92" width="38" height="38" rx="12" fill="#244a3c"/><text x="35" y="119" class="h2 center white">?</text><text x="66" y="118" class="body">Guitar One</text><text x="16" y="170" class="h2">Lessons</text><text x="310" y="170" class="label accent">See All ›</text><rect x="16" y="190" width="370" height="190" rx="18" fill="#fffdf8"/><rect x="16" y="190" width="370" height="68" rx="14" fill="url(#art)"/><text x="30" y="240" class="label white">YOUR FIRST CHORD</text><text x="30" y="294" class="body">Your First Chord</text><text x="30" y="316" class="small">Lesson 2 of 6</text><rect x="30" y="342" width="342" height="5" rx="3" fill="#ebe9e2"/><rect x="30" y="342" width="120" height="5" rx="3" fill="#244a3c"/><text x="16" y="430" class="h2">Progress</text><rect x="16" y="450" width="370" height="80" rx="18" fill="#fffdf8"/><circle cx="58" cy="490" r="25" fill="none" stroke="#ebe9e2" stroke-width="6"/><path d="M58 465a25 25 0 0 1 24 18" fill="none" stroke="#244a3c" stroke-width="6"/><text x="58" y="495" class="small center">40%</text><text x="100" y="490" class="body">Lessons completed</text><use href="#tabs-dashboard"/>
  </g>

  <!-- 06 Tuner -->
  <g id="screen-06-tuner" transform="translate(880 1080)"><text x="0" y="-18" class="label">06 / Tuner</text><rect width="402" height="874" rx="48" fill="#f7f5ef" stroke="#9da59d" stroke-width="2"/><rect x="138" y="12" width="126" height="36" rx="20" fill="#111"/><text x="16" y="120" class="title">Tools</text><rect x="16" y="150" width="370" height="42" rx="11" fill="#ebe9e2"/><rect x="19" y="153" width="181" height="36" rx="8" fill="#244a3c"/><text x="110" y="178" class="button center">♮ Tuner</text><text x="290" y="178" class="label center">◫ Metronome</text><text x="201" y="310" class="title center">E</text><text x="201" y="342" class="small center">String 6 · 82.4 Hz</text><rect x="36" y="380" width="330" height="70" rx="20" fill="#ebe9e2"/><rect x="201" y="388" width="4" height="54" rx="2" fill="#18372d"/><text x="201" y="488" class="label center accent">In tune</text><use href="#tabs-tools"/></g>

  <!-- 07 Metronome -->
  <g id="screen-07-metronome" transform="translate(40 2050)"><text x="0" y="-18" class="label">07 / Metronome</text><rect width="402" height="874" rx="48" fill="#f7f5ef" stroke="#9da59d" stroke-width="2"/><rect x="138" y="12" width="126" height="36" rx="20" fill="#111"/><text x="16" y="120" class="title">Tools</text><rect x="16" y="150" width="370" height="42" rx="11" fill="#ebe9e2"/><text x="110" y="178" class="label center">♮ Tuner</text><rect x="202" y="153" width="181" height="36" rx="8" fill="#244a3c"/><text x="292" y="178" class="button center">◫ Metronome</text><text x="201" y="310" class="title center">96</text><text x="201" y="342" class="small center">BPM</text><text x="201" y="420" class="h2 center forest">−    +</text><text x="201" y="475" class="body center forest">● ○ ○ ○</text><circle cx="201" cy="550" r="32" fill="#244a3c"/><text x="201" y="558" class="button center">▶</text><use href="#tabs-tools"/></g>

  <!-- 08 Live -->
  <g id="screen-08-live" transform="translate(460 2050)"><text x="0" y="-18" class="label">08 / Live practice</text><rect width="402" height="874" rx="48" fill="url(#live)" stroke="#9da59d" stroke-width="2"/><rect x="138" y="12" width="126" height="36" rx="20" fill="#111"/><text x="28" y="90" class="h2 white">×</text><rect x="130" y="70" width="142" height="44" rx="22" fill="#244a3c"/><text x="201" y="98" class="button center">Chord G</text><text x="365" y="90" class="h2 white center">?</text><rect x="16" y="135" width="370" height="520" rx="22" fill="#244a3c35" stroke="#f7f5ef88" stroke-dasharray="5 5"/><text x="201" y="395" class="body center white">Camera preview</text><text x="201" y="430" class="body center" fill="#9bd5ae">1✓  3✓</text><rect x="16" y="680" width="370" height="70" rx="18" fill="#244a3cdd"/><text x="32" y="722" class="body white">Move your 2nd finger to the 3rd fret</text><use href="#tabs-practice"/></g>

  <!-- 09 All lessons -->
  <g id="screen-09-all-lessons" transform="translate(880 2050)"><text x="0" y="-18" class="label">09 / All lessons</text><rect width="402" height="874" rx="48" fill="#f7f5ef" stroke="#9da59d" stroke-width="2"/><rect x="138" y="12" width="126" height="36" rx="20" fill="#111"/><text x="16" y="105" class="h2">‹  All Lessons</text><text x="16" y="160" class="title">All Lessons</text><g fill="#fffdf8"><rect x="16" y="185" width="370" height="66" rx="18"/><rect x="16" y="261" width="370" height="66" rx="18"/><rect x="16" y="337" width="370" height="66" rx="18"/><rect x="16" y="413" width="370" height="66" rx="18"/></g><g class="body"><text x="32" y="215">Your First Chord</text><text x="32" y="291">Strumming Basics</text><text x="32" y="367">Switching Chords</text><text x="32" y="443">Play Your First Song</text></g><g class="small"><text x="32" y="237">In progress</text><text x="32" y="313">In progress</text><text x="32" y="389">Up next</text><text x="32" y="465">Up next</text></g><use href="#tabs-dashboard"/></g>

  <!-- 10 Lesson player -->
  <g id="screen-10-lesson-player" transform="translate(40 3020)"><text x="0" y="-18" class="label">10 / Lesson player</text><rect width="402" height="874" rx="48" fill="#f7f5ef" stroke="#9da59d" stroke-width="2"/><rect x="138" y="12" width="126" height="36" rx="20" fill="#111"/><text x="16" y="105" class="h2">‹  Lesson 2 of 6</text><rect x="16" y="130" width="370" height="210" rx="20" fill="url(#art)"/><text x="201" y="245" class="title center white">▶</text><text x="16" y="390" class="h2">Your First Chord</text><text x="16" y="428" class="body">Build your first shape and learn how each</text><text x="16" y="452" class="body">finger sits on the fretboard.</text><rect x="16" y="490" width="370" height="56" rx="14" fill="#244a3c"/><text x="201" y="525" class="button center">Mark as Complete</text><rect x="16" y="556" width="370" height="56" rx="14" fill="#ebe9e2"/><text x="201" y="591" class="label center">Practice Chord G</text><use href="#tabs-dashboard"/></g>

  <!-- 11 Profile -->
  <g id="screen-11-profile-sheet" transform="translate(460 3020)"><text x="0" y="-18" class="label">11 / Profile sheet</text><rect width="402" height="874" rx="48" fill="#f7f5ef" stroke="#9da59d" stroke-width="2"/><rect x="138" y="12" width="126" height="36" rx="20" fill="#111"/><rect width="402" height="874" rx="48" fill="#244a3c52"/><path d="M0 520Q0 440 70 440H332Q402 440 402 520V874H0Z" fill="#f7f5ef"/><rect x="182" y="460" width="38" height="5" rx="3" fill="#a5aaa4"/><text x="32" y="540" class="label accent">Done</text><text x="201" y="540" class="h2 center">Profile</text><circle cx="201" cy="595" r="35" fill="#244a3c"/><text x="201" y="607" class="title center white">?</text><text x="201" y="650" class="body center">Name</text><g fill="#fffdf8"><rect x="16" y="670" width="370" height="48" rx="14"/><rect x="16" y="726" width="370" height="48" rx="14"/><rect x="16" y="782" width="370" height="48" rx="14"/></g><text x="32" y="700" class="body">Name ›</text><text x="32" y="756" class="body">Preferences ›</text><text x="32" y="812" class="body danger">Reset Progress ›</text></g>

  <!-- 12 Action sheet -->
  <g id="screen-12-action-sheet" transform="translate(880 3020)"><text x="0" y="-18" class="label">12 / Action sheet</text><rect width="402" height="874" rx="48" fill="#f7f5ef" stroke="#9da59d" stroke-width="2"/><rect x="138" y="12" width="126" height="36" rx="20" fill="#111"/><rect width="402" height="874" rx="48" fill="#244a3c52"/><path d="M0 600Q0 520 70 520H332Q402 520 402 600V874H0Z" fill="#f7f5ef"/><rect x="182" y="540" width="38" height="5" rx="3" fill="#a5aaa4"/><text x="201" y="595" class="h2 center">Chord G</text><rect x="16" y="620" width="370" height="56" rx="14" fill="#fffdf8"/><rect x="16" y="686" width="370" height="56" rx="14" fill="#fffdf8"/><text x="32" y="655" class="body">Change chord ›</text><text x="32" y="721" class="body">Show chord diagram ›</text><rect x="16" y="760" width="370" height="56" rx="14" fill="#ebe9e2"/><text x="201" y="795" class="label center">Cancel</text></g>

  <!-- 13 Completion alert -->
  <g id="screen-13-completion-alert" transform="translate(40 3990)"><text x="0" y="-18" class="label">13 / Completion alert</text><rect width="402" height="874" rx="48" fill="#f7f5ef" stroke="#9da59d" stroke-width="2"/><rect x="138" y="12" width="126" height="36" rx="20" fill="#111"/><rect width="402" height="874" rx="48" fill="#244a3c52"/><rect x="66" y="350" width="270" height="160" rx="14" fill="#f7f5ef"/><text x="201" y="405" class="label center">Lesson complete</text><text x="201" y="436" class="small center">Nice work. Your progress has been updated.</text><path d="M66 466H336" stroke="#d6d5ce"/><text x="201" y="495" class="body center accent">OK</text></g>

  <!-- 14 Camera alert -->
  <g id="screen-14-camera-alert" transform="translate(460 3990)"><text x="0" y="-18" class="label">14 / Camera permission alert</text><rect width="402" height="874" rx="48" fill="#f7f5ef" stroke="#9da59d" stroke-width="2"/><rect x="138" y="12" width="126" height="36" rx="20" fill="#111"/><rect width="402" height="874" rx="48" fill="#244a3c52"/><rect x="66" y="315" width="270" height="230" rx="14" fill="#f7f5ef"/><text x="201" y="365" class="label center">“Guitar One” Would Like to</text><text x="201" y="386" class="label center">Access the Camera</text><text x="201" y="425" class="small center">Guitar One uses the camera to check</text><text x="201" y="445" class="small center">your finger placement.</text><path d="M66 480H336M201 480V545" stroke="#d6d5ce"/><text x="133" y="515" class="body center accent">Don't Allow</text><text x="268" y="515" class="body center accent">OK</text></g>

  <!-- 15 Reset -->
  <g id="screen-15-reset-alert" transform="translate(880 3990)"><text x="0" y="-18" class="label">15 / Reset confirmation</text><rect width="402" height="874" rx="48" fill="#f7f5ef" stroke="#9da59d" stroke-width="2"/><rect x="138" y="12" width="126" height="36" rx="20" fill="#111"/><rect width="402" height="874" rx="48" fill="#244a3c52"/><rect x="66" y="350" width="270" height="160" rx="14" fill="#f7f5ef"/><text x="201" y="405" class="label center">Reset Progress?</text><text x="201" y="436" class="small center">This will clear your lesson progress.</text><path d="M66 466H336M201 466V510" stroke="#d6d5ce"/><text x="133" y="495" class="body center accent">Cancel</text><text x="268" y="495" class="body center danger">Reset</text></g>

  <defs>
    <g id="tabs-dashboard"><path d="M0 788H402V874H0Z" fill="#f7f5ef" opacity=".96"/><path d="M0 788H402" stroke="#d6d5ce"/><text x="67" y="820" class="body center forest">▦</text><text x="67" y="845" class="small center forest">Dashboard</text><text x="201" y="820" class="body center muted">♬</text><text x="201" y="845" class="small center muted">Practice</text><text x="335" y="820" class="body center muted">◫</text><text x="335" y="845" class="small center muted">Tools</text></g>
