<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Saaz iPhone Prototype</title>
<style>
/* Layout: prototype guide panel left, scaled iPhone 17 frame right (stacked on narrow screens). Theme taken from the logo: ink black, champagne ribbon, copper strings, amber glow. */
:root{
  color-scheme:dark;
  --ink:#0a0908; --s1:#14110f; --s2:#1c1814; --s3:#27211b;
  --line:rgba(232,220,198,.12); --line2:rgba(232,220,198,.24);
  --fg:#f1e8d8; --fg2:#b9ad98; --fg3:#8e8372;
  --champ:#e8d9bd; --gold:#d3ae7c; --copper:#c27d4a; --glow:#e29a54;
  --ok:#9fcba7; --bad:#f0907a; --warn:#e8b95f; --onchamp:#1a1410;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--ink);color:var(--fg);font-family:var(--sys);min-height:100vh;
  background-image:radial-gradient(900px 600px at 70% 10%,rgba(194,125,74,.10),transparent 60%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--champ);outline-offset:2px}
.page{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:8px}
.panel{width:300px;flex:none;display:flex;flex-direction:column;gap:18px;padding-top:8px;position:sticky;top:24px}
.panel h1{margin:0;font-size:28px;letter-spacing:-.02em;font-weight:650}
.panel p{margin:0;color:var(--fg2);font-size:14px;line-height:1.45}
.panel h3{margin:0 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);font-weight:600}
.jumps{display:flex;flex-wrap:wrap;gap:6px}
.jumps button{font-size:13px;padding:7px 11px;border-radius:999px;border:1px solid var(--line2);color:var(--fg2);background:var(--s1)}
.jumps button:hover{color:var(--fg);border-color:var(--gold)}
.restart{align-self:flex-start;font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;background:linear-gradient(180deg,#f0e3ca,#cfa979);color:var(--onchamp)}
.stagewrap{flex:none;position:relative}


/* Phone frame */
.phone{position:absolute;left:12px;top:12px;width:402px;height:874px;border-radius:58px;background:#000;overflow:hidden;transform-origin:0 0;
  box-shadow:0 0 0 10px #17140f,0 0 0 11.5px #4a4237,0 50px 90px rgba(0,0,0,.65)}
.island{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;background:#000;border-radius:20px;z-index:1000}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 46px;z-index:999;font-size:16px;font-weight:600;pointer-events:none}
.status .r{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;bottom:8px;left:50%;width:140px;height:5px;margin-left:-70px;border-radius:3px;background:rgba(241,232,216,.75);z-index:999;pointer-events:none}
#host{position:absolute;inset:0;background:var(--ink);overflow:hidden;border-radius:58px;font-size:17px}

/* Layers */
.layer{position:absolute;inset:0}
.layer.root.enter{animation:fadeIn .35s ease both}
.layer.root.exit{animation:fadeOut .25s ease both}
.layer.exit{pointer-events:none}
.layer.push{background:var(--ink)}
.layer.push.enter{animation:pushIn .38s cubic-bezier(.22,.9,.3,1) both}
.layer.push.exit{animation:pushOut .32s cubic-bezier(.4,0,.8,.4) both}
.layer.full{background:var(--ink)}
.layer.full.enter{animation:upIn .42s cubic-bezier(.22,.9,.3,1) both}
.layer.full.exit{animation:upOut .34s cubic-bezier(.4,0,.8,.4) both}
.layer.sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.layer.sheet .sheet{position:absolute;left:0;right:0;bottom:0;top:62px;background:var(--s1);border-radius:34px 34px 0 0;border-top:1px solid var(--line2);display:flex;flex-direction:column;overflow:hidden}
.layer.sheet.enter .scrim{animation:fadeIn .3s both}
.layer.sheet.enter .sheet{animation:upIn .42s cubic-bezier(.22,.9,.3,1) both}
.layer.sheet.exit .scrim{animation:fadeOut .3s both}
.layer.sheet.exit .sheet{animation:upOut .34s cubic-bezier(.4,0,.8,.4) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes fadeOut{to{opacity:0}}
@keyframes pushIn{from{transform:translateX(100%)}to{transform:none}}@keyframes pushOut{to{transform:translateX(100%)}}
@keyframes upIn{from{transform:translateY(100%)}to{transform:none}}@keyframes upOut{to{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){.layer *,.layer{animation-duration:.01s!important}}

.scr{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;scrollbar-width:none;padding-inline:20px;padding-bottom:130px}
.scroll::-webkit-scrollbar{display:none}
.scroll.top{padding-top:64px}
.scroll.nobar{padding-bottom:40px}
.nav{flex:none;padding-top:54px;height:98px;display:flex;align-items:center;padding-inline:8px;position:relative;background:linear-gradient(var(--ink) 70%,transparent)}
.navb{display:flex;align-items:center;gap:0;color:var(--champ);height:44px;padding-inline:8px;font-size:17px}
.navt{position:absolute;left:0;right:0;text-align:center;font-weight:600;font-size:17px;pointer-events:none}
.navr{margin-left:auto;position:relative}
h1.lt{font-size:34px;letter-spacing:-.02em;font-weight:700;margin:0}
h2.sh{font-size:20px;font-weight:650;margin:0;letter-spacing:-.01em}
.hrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(160deg,#f0e3ca,#b98d5c);color:var(--onchamp);font-weight:700;font-size:18px;display:grid;place-items:center}
.card{background:var(--s1);border:1px solid var(--line);border-radius:24px;display:block;width:100%}
.stack{display:flex;flex-direction:column;gap:14px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin-top:26px;margin-bottom:12px}
.link{color:var(--gold);font-size:15px;font-weight:600;min-height:44px;display:inline-flex;align-items:center}
.cap{font-size:13px;color:var(--fg2)}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:56px;width:100%;border-radius:28px;font-size:17px;font-weight:650}
.btn.primary{background:linear-gradient(180deg,#f2e6cf,#d0aa7a);color:var(--onchamp);box-shadow:0 10px 30px rgba(226,154,84,.22)}
.btn.sec2{background:var(--s3);border:1px solid var(--line2);color:var(--fg)}
.btn.ghost{color:var(--gold)}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.sm{height:46px;font-size:15px}
.row{display:flex;align-items:center;gap:14px}
.chev{color:var(--fg3);margin-left:auto;flex:none}

/* Launch */
.launchbg{background:radial-gradient(420px 380px at 55% 40%,rgba(226,154,84,.22),transparent 70%),var(--ink)}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding-top:40px}
.hero h1{margin:0;font-size:44px;letter-spacing:.02em;font-weight:700}
.hero p{margin:0;color:var(--fg2);font-size:17px;text-align:center;max-width:270px;line-height:1.4}
.cta{padding:0 20px 54px;display:flex;flex-direction:column;gap:12px}
.perm{display:flex;gap:16px;align-items:center;padding:16px}
.perm .pi{width:48px;height:48px;border-radius:14px;background:var(--s3);display:grid;place-items:center;color:var(--champ);flex:none}
.perm b{display:block;font-size:17px;font-weight:600}
.privacy{display:flex;gap:14px;padding:16px;border-radius:20px;background:rgba(232,217,189,.07);border:1px solid var(--line2)}
.privacy svg{color:var(--gold);flex:none}
.privacy p{margin:0;font-size:15px;line-height:1.4;color:var(--fg)}
.status-row{display:flex;align-items:center;gap:12px;padding:14px 16px;font-size:17px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid currentColor}
.pill.ok{color:var(--ok)}.pill.bad{color:var(--bad)}.pill.warn{color:var(--warn)}.pill.mute{color:var(--fg2)}

/* Tab bar */
#tabbar{position:absolute;left:18px;right:18px;bottom:24px;height:66px;border-radius:34px;z-index:50;display:flex;padding:6px;
  background:rgba(32,27,22,.66);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);border:1px solid var(--line2);box-shadow:0 14px 40px rgba(0,0,0,.5)}
#tabbar[hidden]{display:none}
.tab{flex:1;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--fg2)}
.tab.on{background:rgba(232,217,189,.14);color:var(--champ)}

/* Ring / lessons */
.ringcard{display:flex;align-items:center;gap:18px;padding:18px}
.ringtxt b{font-size:22px;display:block;font-weight:650}
.cont{display:flex;gap:16px;align-items:center;padding:14px 16px 14px 14px;background:linear-gradient(135deg,rgba(194,125,74,.22),var(--s1) 60%)}
.cont .mini{width:70px;height:96px;flex:none;background:var(--ink);border-radius:14px;display:grid;place-items:center}
.lrow{display:flex;align-items:center;gap:14px;padding:12px 14px;min-height:76px}
.lrow .mini{width:44px;height:60px;flex:none;background:var(--ink);border-radius:10px;display:grid;place-items:center}
.lrow b{font-size:17px;font-weight:600;display:block}
.sg{border-radius:24px;background:var(--s1);border:1px solid var(--line);overflow:hidden}
.sg>*+*{border-top:1px solid var(--line)}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;flex:none;color:transparent}
.chk.on{background:var(--ok);border-color:var(--ok);color:var(--onchamp)}
.next{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;background:rgba(159,203,167,.1);border:1px solid rgba(159,203,167,.4)}

/* Practice */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chordcard{padding:14px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;border-radius:24px;background:var(--s1);border:1px solid var(--line)}
.chordcard .mini{height:132px;display:grid;place-items:center}
.chordcard b{font-size:24px;font-weight:700}
.chordcard.sel{border-color:var(--gold);background:linear-gradient(180deg,rgba(211,174,124,.16),var(--s1))}
.tunep{display:flex;align-items:center;gap:14px;padding:16px;margin-top:18px}
.tunep .pi{width:44px;height:44px;border-radius:12px;background:var(--s3);display:grid;place-items:center;color:var(--gold);flex:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:8px auto 0;flex:none}
.shead{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 8px}
.shead b{font-size:17px}
.xbtn{width:36px;height:36px;border-radius:50%;background:var(--s3);display:grid;place-items:center;color:var(--fg2)}
.chips{display:flex;gap:8px;justify-content:center;padding:6px 0 4px}
.chip{min-width:62px;height:44px;border-radius:22px;border:1px solid var(--line2);font-weight:650;font-size:17px;display:grid;place-items:center;color:var(--fg2)}
.chip.on{background:var(--champ);color:var(--onchamp);border-color:var(--champ)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;font-size:13px;color:var(--fg2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.fdot{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ecc08a,#b46d3d);color:#1a1008;font-size:12px;font-weight:700;display:grid;place-items:center}

/* Live practice */
.live{background:radial-gradient(500px 360px at 50% 28%,rgba(194,125,74,.14),transparent 70%),var(--ink)}
.ltop{padding:54px 14px 0;display:flex;align-items:center;justify-content:space-between;height:100px}
.ltop .ttl{display:flex;flex-direction:column;align-items:center;font-size:13px;color:var(--fg2)}
.ltop .ttl b{font-size:17px;color:var(--fg)}
.lbtn{height:40px;padding-inline:14px;border-radius:20px;background:var(--s3);border:1px solid var(--line2);display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.lbtn.on{color:var(--champ);border-color:var(--gold)}
.vf{margin:6px 20px 0;height:352px;border-radius:28px;position:relative;overflow:hidden;background:linear-gradient(180deg,#1f1a15,#0e0c0a);border:1px solid var(--line2);display:grid;place-items:center}
.vf::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 2px,rgba(255,255,255,.015) 2px 4px)}
.vf .br{position:absolute;width:26px;height:26px;border:3px solid var(--gold);opacity:.9}
.vf .tl{top:14px;left:14px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}.vf .tr{top:14px;right:14px;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.vf .bl{bottom:14px;left:14px;border-right:0;border-top:0;border-radius:0 0 0 10px}.vf .brr{bottom:14px;right:14px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.vf .tag{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:600;background:rgba(10,9,8,.7);padding:5px 10px;border-radius:12px;color:var(--fg2);display:flex;gap:6px;align-items:center;white-space:nowrap}
.rec{width:8px;height:8px;border-radius:50%;background:var(--glow);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.vf svg.cd{height:300px!important;width:auto!important;margin-top:14px;position:relative}
.meter{display:flex;gap:16px;align-items:center;padding:14px 22px 0}
.bars{flex:1;display:flex;align-items:center;gap:3px;height:48px}
.bars i{flex:1;background:linear-gradient(var(--glow),var(--copper));border-radius:3px;height:6%;min-height:3px;transition:height .09s}
.heard{text-align:right;min-width:92px}
.heard b{font-size:34px;font-weight:700;line-height:1;display:block;letter-spacing:-.02em}
.conf{margin:10px 22px 0;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--fg2)}
.conf .bar{flex:1;height:8px;border-radius:4px;background:var(--s3);overflow:hidden}
.conf .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--copper),var(--champ));border-radius:4px;transition:width .4s}
.cmp{display:flex;gap:8px;margin:12px 20px 0}
.cmp div{flex:1;display:flex;gap:8px;align-items:center;padding:9px 11px;border-radius:14px;background:var(--s1);border:1px solid var(--line);font-size:13px;line-height:1.25}
.strip{position:absolute;left:12px;right:12px;bottom:26px;border-radius:30px;padding:16px 16px 16px;background:rgba(28,24,20,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line2);display:flex;flex-direction:column;gap:12px}
.strip .hd{display:flex;gap:12px;align-items:flex-start}
.strip .ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;border:2px solid currentColor}
.strip b{font-size:18px;display:block;margin-bottom:2px}
.strip p{margin:0;font-size:15px;color:var(--fg2);line-height:1.35}
.st-bad{color:var(--bad)}.st-ok{color:var(--ok)}.st-warn{color:var(--warn)}.st-mute{color:var(--fg2)}
.strip .t{color:var(--fg)}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* Tools */
.seg{display:flex;padding:3px;border-radius:14px;background:var(--s2);border:1px solid var(--line);margin:16px 0 20px}
.seg button{flex:1;height:38px;border-radius:11px;text-align:center;font-weight:600;font-size:15px;color:var(--fg2)}
.seg button.on{background:var(--s3);color:var(--champ);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.note{text-align:center;margin-top:6px}
.note b{font-size:96px;font-weight:700;line-height:1;letter-spacing:-.03em}
.note sub{font-size:28px;color:var(--fg2);font-weight:600;vertical-align:baseline;position:relative;bottom:-2px}
.hz{color:var(--fg2);font-size:15px;font-variant-numeric:tabular-nums;margin-top:4px}
.gauge{position:relative;height:84px;margin:22px 4px 8px}
.gauge .tr{position:absolute;left:0;right:0;top:34px;height:4px;border-radius:2px;background:var(--s3)}
.gauge .zone{position:absolute;left:45%;width:10%;top:22px;height:28px;border-radius:8px;background:rgba(159,203,167,.2);border:1.5px solid var(--ok)}
.gauge .tk{position:absolute;top:30px;width:2px;height:12px;background:var(--line2);margin-left:-1px}
.gauge .tk.big{top:26px;height:20px;background:var(--fg3)}
.gauge .nd{position:absolute;left:0;top:8px;height:56px;width:4px;margin-left:-2px;border-radius:2px;background:linear-gradient(var(--champ),var(--glow));transition:left .12s linear;box-shadow:0 0 14px rgba(226,154,84,.6)}
.gauge .lb{position:absolute;top:62px;font-size:12px;font-weight:600;color:var(--fg2);display:flex;gap:4px;align-items:center}
.tstat{display:flex;justify-content:center;margin:6px 0 16px;min-height:44px}
.tstat .pill{font-size:16px;padding:9px 16px;gap:8px}
.strs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.strs .sc{aspect-ratio:1/1.2;border-radius:18px;background:var(--s1);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:22px;font-weight:700;position:relative}
.strs .sc small{font-size:11px;color:var(--fg3);font-weight:600}
.strs .sc.on{border-color:var(--gold);background:rgba(211,174,124,.14)}
.strs .sc .ok{position:absolute;top:-7px;right:-5px;width:20px;height:20px;border-radius:50%;background:var(--ok);color:var(--onchamp);display:grid;place-items:center}
.pegs{display:flex;gap:12px;margin-top:20px}
.pegs button{flex:1}
.bpm{text-align:center;margin-top:12px}
.bpm b{font-size:112px;line-height:1;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.bpm span{display:block;color:var(--fg2);font-size:15px;letter-spacing:.14em;font-weight:600;margin-top:-4px}
.bctl{display:flex;align-items:center;gap:16px;margin:22px 0 8px}
.rb{width:64px;height:64px;border-radius:50%;background:var(--s2);border:1px solid var(--line2);display:grid;place-items:center;flex:none;color:var(--champ)}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:3px;background:var(--s3);outline-offset:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:linear-gradient(180deg,#f2e6cf,#cfa979);box-shadow:0 2px 8px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#e8d9bd}
.beats{display:flex;justify-content:center;gap:18px;margin:26px 0 30px}
.beats i{width:48px;height:48px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;font-style:normal;font-weight:700;color:var(--fg3);transition:all .06s}
.beats i.on{background:var(--champ);border-color:var(--champ);color:var(--onchamp);box-shadow:0 0 24px rgba(232,217,189,.5);transform:scale(1.1)}
.beats i.on.a{background:var(--glow);border-color:var(--glow);box-shadow:0 0 28px rgba(226,154,84,.7)}

/* Progress / Profile */
.bigring{display:grid;place-items:center;margin:8px 0 20px;position:relative}
.bigring .ctr{position:absolute;text-align:center}
.bigring .ctr b{font-size:44px;font-weight:700;display:block;letter-spacing:-.03em}
.pbar{display:grid;grid-template-columns:44px 1fr 64px;gap:12px;align-items:center;padding:12px 16px;font-size:15px}
.pbar .trk{height:12px;border-radius:6px;background:var(--s3);overflow:hidden}
.pbar .trk i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--copper),var(--champ))}
.pbar b{font-size:20px}
.pbar span{text-align:right;color:var(--fg2);font-variant-numeric:tabular-nums}
.field{display:flex;align-items:center;gap:12px;padding:14px 16px}
.field label{color:var(--fg2);width:64px;flex:none;font-size:15px}
.field input{flex:1;background:none;border:0;color:var(--fg);font:inherit;font-size:17px;min-width:0;padding:6px 0}
.tg{width:51px;height:31px;border-radius:16px;background:var(--s3);border:1px solid var(--line2);position:relative;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:50%;background:#d9d0c0;transition:transform .2s}

/* ---------- Chord diagram ---------- */
function chordSVG(key,o={}){
 const {state='full',labels=true,cls=''}=o;const nums=S.prefs.nums;
 const c=CH[key],m=MIS[key];const x0=64,dx=28,y0=46,fh=46;
 const X=i=>x0+i*dx,Y=f=>y0+(f-.5)*fh;let s='';
 for(let i=1;i<=5;i++)s+=`<line x1="${x0-6}" x2="${X(5)+6}" y1="${y0+i*fh}" y2="${y0+i*fh}" stroke="rgba(232,220,198,.24)" stroke-width="1.2"/>`;
 s+=`<rect x="${x0-6}" y="${y0-5}" width="${5*dx+12}" height="6" rx="3" fill="url(#gChamp)"/>`;
 const w=[2.8,2.4,2,1.5,1.2,1];
 for(let i=0;i<6;i++)s+=`<line x1="${X(i)}" x2="${X(i)}" y1="${y0}" y2="${y0+5*fh}" stroke="#e8d9bd" stroke-opacity=".85" stroke-width="${w[i]}"/>`;
 c.s.forEach((v,i)=>{
  if(v===-1)s+=`<path d="M${X(i)-5} 21l10 10M${X(i)+5} 21l-10 10" stroke="#b9ad98" stroke-width="2" stroke-linecap="round"/>`;
  if(v===0)s+=`<circle cx="${X(i)}" cy="26" r="5.5" fill="none" stroke="#e8d9bd" stroke-width="2"/>`;
 });
 c.s.forEach((v,i)=>{
  if(v<=0)return;const f=c.f[i],cx=X(i),cy=Y(v);
  if(state==='mistake'&&m.miss.s===i){
   s+=`<circle cx="${cx}" cy="${cy}" r="14" fill="rgba(240,144,122,.12)" stroke="#f0907a" stroke-width="2.2" stroke-dasharray="4 4"/><text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="15" font-weight="800" fill="#f0907a">!</text>`;
  }else if(state==='ghost'){
   s+=`<circle cx="${cx}" cy="${cy}" r="13" fill="rgba(194,125,74,.14)" stroke="#c27d4a" stroke-width="1.6" stroke-dasharray="3 3"/>${nums?`<text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="13" font-weight="700" fill="#c9a075">${f}</text>`:''}`;
  }else{
   s+=`<circle cx="${cx}" cy="${cy}" r="13" fill="url(#gDot)" ${state==='correct'?'stroke="#9fcba7" stroke-width="2.6"':''}/>${nums?`<text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="14" font-weight="800" fill="#1a1008">${f}</text>`:''}`;
  }
 });
 if(state==='mistake'&&m.extra){const cx=X(m.extra.s),cy=Y(m.extra.f);
  s+=`<circle cx="${cx}" cy="${cy}" r="13" fill="rgba(240,144,122,.15)" stroke="#f0907a" stroke-width="2.2"/><path d="M${cx-5} ${cy-5}l10 10M${cx+5} ${cy-5}l-10 10" stroke="#f0907a" stroke-width="2.4" stroke-linecap="round"/>`;}
 if(labels){
  for(let f=1;f<=4;f++)s+=`<text x="${x0-18}" y="${y0+(f-.5)*fh+4}" text-anchor="end" font-size="11" fill="#8e8372">fret ${f}</text>`;
  ['E','A','D','G','B','e'].forEach((n,i)=>s+=`<text x="${X(i)}" y="${y0+5*fh+22}" text-anchor="middle" font-size="13" font-weight="600" fill="#b9ad98">${n}</text>`);
 }
 const vb=labels?'0 0 250 322':'40 8 190 282';
 return `<svg class="cd ${cls}" viewBox="${vb}" role="img" aria-label="${c.n} chord diagram" style="width:100%;height:100%">${s}</svg>`;
}

/* ---------- Engine ---------- */
const host=$('#host'),els={};let first=true;
const kindOf={getstarted:'root',allow:'push',needed:'push',iossettings:'full',profile:'sheet',chord:'sheet',about:'sheet',privacy:'sheet',video:'sheet',live:'full'};
function layers(){
 const L=[];
 if(S.phase==='launch')S.launch.forEach((n,i)=>L.push({key:'l:'+n,name:n,kind:kindOf[n],z:1+i,p:{}}));
 else{L.push({key:'t:'+S.tab,name:S.tab,kind:'root',z:1,p:{}});S.stacks[S.tab].forEach((p,i)=>L.push({key:`t:${S.tab}:${i}:${p.name}`,name:p.name,kind:'push',z:2+i,p}));}
 S.overlays.forEach((o,i)=>L.push({key:`o:${i}:${o.name}`,name:o.name,kind:kindOf[o.name],z:100+i*10,p:o}));
 return L;
}
function paint(o){
 const sc=o.el.querySelector('.scroll'),st=sc?sc.scrollTop:0;
 const keep=o.el.querySelector('.cam');
 o.el.innerHTML=R[o.l.name](o.l.p,o.l);
 if(keep){const n=o.el.querySelector('.cam');if(n){n.className=keep.className.replace(/\bon\b/,'').trim()+(camOn?' on':'');n.replaceWith(keep);keep.className='cam'+(camOn?' on':'')}}
 const s2=o.el.querySelector('.scroll');if(s2)s2.scrollTop=st;
 after(o.l.name,o.el);
}
function sync(force=true){
 const L=layers(),keys=new Set(L.map(l=>l.key));
 for(const k in els)if(!keys.has(k)){const o=els[k];delete els[k];const e=o.el;
  if(first){e.remove();continue}
  e.classList.add('exit');setTimeout(()=>e.remove(),o.l.kind==='root'?260:360);}
 L.forEach(l=>{let o=els[l.key];
  if(!o){const e=document.createElement('div');e.className='layer '+l.kind;host.appendChild(e);o=els[l.key]={el:e,l};
   if(!first){e.classList.add('enter');setTimeout(()=>e.classList.remove('enter'),480)}
   o.l=l;paint(o);}
  else{o.l=l;if(force)paint(o);}
  o.el.style.zIndex=l.z;});
 const full=S.overlays.some(o=>o.name==='iossettings');
 const tb=$('#tabbar');tb.hidden=S.phase!=='app'||full;
 const topO=S.overlays[S.overlays.length-1];tb.style.zIndex=topO&&topO.name==='live'?100+(S.overlays.length-1)*10+5:50;
 if(!tb.hidden)tb.innerHTML=[['dashboard','grid','Dashboard'],['practice','guitar','Practice'],['tools','fork','Tools']].map(([t,i,n])=>`<button class="tab ${S.tab===t?'on':''}" data-a="tab" data-t="${t}" aria-current="${S.tab===t}">${ic(i,24)}${n}</button>`).join('');
 const al=$('#alert');
 if(S.alert&&S.alert.sheet){al.hidden=false;al.className='as';const a=S.alert;al.innerHTML=`<div class="asw"><div class="ascard"><div class="astx"><b>${a.t}</b><span>${a.m}</span></div>${a.b.filter(b=>b.a!=='dismiss').map(b=>`<button class="${b.s||''}" data-a="${b.a}">${b.l}</button>`).join('')}</div><div class="ascard"><button class="b" data-a="dismiss">Cancel</button></div></div>`;}
 else if(S.alert){al.className='';al.hidden=false;const a=S.alert;al.innerHTML=`<div class="abox" role="alertdialog" aria-label="${a.t}"><div class="tx"><h4>${a.t}</h4><p>${a.m}</p></div><div class="abtns ${a.col?'col':''}">${a.b.map(b=>`<button class="${b.s||''}" data-a="${b.a}" data-v="${b.v||''}">${b.l}</button>`).join('')}</div></div>`;}
 else{al.hidden=true;al.className=''}
 first=false;
}
let tt;function toast(t){const e=$('#toast');e.innerHTML=ic('check',18)+t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1900);}

/* ---------- Live / tuner / metronome runtime ---------- */
let tick={live:null,tuner:null,metro:null,phase:null,video:null};
let camStream=null,camOn=false,camTried=false;
function stopCam(){if(camStream){camStream.getTracks().forEach(t=>t.stop())}camStream=null;camOn=false;camTried=false}
function startCam(){
 if(camTried)return;camTried=true;
 try{navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(st=>{if(!S.live){st.getTracks().forEach(t=>t.stop());return}camStream=st;camOn=true;attachCam();sync(true)}).catch(()=>{})}catch(e){}
}
function attachCam(){const v=$('#camv');if(v&&camStream&&v.srcObject!==camStream){v.srcObject=camStream;v.play&&v.play().catch(()=>{})}}
function stopLive(){clearInterval(tick.live);clearTimeout(tick.phase);tick.live=tick.phase=null;stopCam()}
function livePhase(){clearTimeout(tick.phase);const L=S.live;if(!L||!L.listening)return;
 tick.phase=setTimeout(()=>{if(!S.live)return;L.phase=L.phase===6?2:L.phase+1;L.pt=Date.now();sync(true)},PH[L.phase])}
function liveTick(){
 const b=[...document.querySelectorAll('#bars i')];if(!b.length){return}
 const L=S.live;if(!L)return;
 const strum=(L.phase===5||L.phase===6)&&Date.now()-L.pt<1600;
 const amp=!L.listening?0:strum?.95:.12;
 b.forEach((e,i)=>{const w=strum?Math.abs(Math.sin(i*.6+Date.now()/90)):Math.random();e.style.height=Math.max(6,amp*w*100)+'%'});
}
function videoTick(){const V=S.video;const [m,sc]=LES[V.id].dur.split(':').map(Number),d=m*60+sc;V.t=Math.min(d,V.t+.25);
 const b=$('#vb'),t=$('#vt');if(b)b.style.width=V.t/d*100+'%';if(t)t.textContent=Math.floor(V.t/60)+':'+String(Math.floor(V.t%60)).padStart(2,'0');
 if(V.t>=d){V.playing=false;clearInterval(tick.video);sync(true)}}
function stopTuner(){clearInterval(tick.tuner);tick.tuner=null;S.tuner.on=false}
function tunerTick(){
 const T=S.tuner;const nd=$('#needle');if(!nd)return;
 let rep_=false;
 if(T.on){const dt=.09;
  if(T.done){T.hold+=dt;if(T.hold>3){T.tuned=[false,false,false,false,false,false];T.done=false;T.sel=0;T.cur=T.start[0];T.hold=0;rep_=true}}
  else if(Math.abs(T.cur)>.01){T.cur-=Math.sign(T.cur)*Math.min(Math.abs(T.cur),9*dt)}
  else{T.hold+=dt;if(T.hold>1.4){T.tuned[T.sel]=true;T.hold=0;const nx=T.tuned.findIndex(x=>!x);if(nx<0){T.done=true}else{T.sel=nx;T.cur=T.start[nx]}rep_=true}}
 }
 if(rep_){sync(true);return}
 const cents=T.cur,c=T.on&&!T.done?cents+(Math.abs(cents)>.5?Math.sin(Date.now()/160)*.8:0):0;
 nd.style.left=(50+Math.max(-55,Math.min(55,c)))+'%';nd.style.opacity=T.on?1:.35;
 const s=STR[T.sel],hz=s.f*Math.pow(2,cents/1200),hzE=$('#thz'),ts=$('#tstat');
 if(T.on&&T.done){hzE.textContent='';ts.innerHTML=`<span class="pill ok">${ic('check',20)}All six strings in tune</span>`}
 else if(T.on){hzE.textContent=hz.toFixed(1)+' Hz · '+(cents>0.5?'+':cents<-0.5?'−':'')+Math.abs(Math.round(cents))+' cents';
  const ps=pitchState(cents);
  ts.innerHTML=ps==='in'?`<span class="pill ok">${ic('check',20)}In tune</span>`:ps==='flat'?`<span class="pill warn">${ic('up',20)}Flat · tighten the string</span>`:`<span class="pill warn">${ic('down',20)}Sharp · loosen the string</span>`;}
 else{hzE.textContent='Play a string on your guitar';ts.innerHTML=`<span class="pill mute">${ic('mic',16)}Not listening</span>`}
}
function metroStop(){clearInterval(tick.metro);tick.metro=null;S.metro.on=false}
let actx;
function click(acc){if(!S.prefs.click)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=acc?1500:1000;g.gain.setValueAtTime(.3,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.06);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.07)}catch(e){}}
function beatUI(){const b=[...document.querySelectorAll('#beats i')];b.forEach((e,i)=>e.classList.toggle('on',S.metro.on&&i===S.metro.beat))}
function metroRun(){clearInterval(tick.metro);
 const step=()=>{click(S.metro.beat===0);beatUI();S.metro.beat=(S.metro.beat+1)%4};
 S.metro.beat=0;step();tick.metro=setInterval(()=>{if(!$('#beats')){metroStop();return}step()},60000/S.metro.bpm);
 // visual state shows the beat just played
}
function after(name,el){
 if(name==='live'){clearInterval(tick.live);tick.live=setInterval(liveTick,110);liveTick();attachCam();startCam();livePhase()}
 if(name==='video'){clearInterval(tick.video);if(S.video.playing)tick.video=setInterval(videoTick,250)}
 if(name==='tools'){
  if(S.tools.seg==='tuner'){clearInterval(tick.tuner);tick.tuner=setInterval(tunerTick,90);tunerTick()}
  else{const r=$('#bpmr',el);if(r){r.oninput=()=>{S.metro.bpm=+r.value;$('#bpmv').textContent=r.value;if(S.metro.on)metroRun()}}
   if(S.metro.on){const b=[...document.querySelectorAll('#beats i')];const cur=(S.metro.beat+3)%4;b[cur]&&b[cur].classList.add('on')}}
 }
 if(name==='profile'){const i=$('#nm',el);if(i){i.oninput=()=>{S.name=i.value||''};i.onchange=()=>sync(true);}}
}

/* ---------- Actions ---------- */
function leaveTools(){stopTuner();metroStop();clearInterval(tick.tuner)}
function popOverlay(){
 const o=S.overlays.pop();
 if(o&&o.name==='live'){commitLive(o);stopLive();S.live=null}
 if(o&&o.name==='video'){clearInterval(tick.video);S.video.playing=false}
}
function commitLive(o){const L=S.live;if(!L)return;S.time[o.chord]=(S.time[o.chord]||0)+Math.round((Date.now()-L.start)/1000);S.last=o.chord}
function openLive(chord){S.live={phase:0,listening:true,start:Date.now(),pt:Date.now()};S.overlays.push({name:'live',chord});}
function askCam(){if(S.perm.cam==='unknown')S.alert={t:'“Saaz” Would Like to Access the Camera',m:'Saaz uses the camera to see where your fingers are on the fretboard.',b:[{l:'Don’t Allow',a:'ans',v:'cam:denied'},{l:'OK',a:'ans',v:'cam:granted',s:'b'}]};else askMic()}
function askMic(){if(S.perm.mic==='unknown')S.alert={t:'“Saaz” Would Like to Access the Microphone',m:'Saaz uses the microphone to hear which chord or note you play.',b:[{l:'Don’t Allow',a:'ans',v:'mic:denied'},{l:'OK',a:'ans',v:'mic:granted',s:'b'}]};else finish()}
function finish(){S.alert=null;if(S.perm.cam==='granted'&&S.perm.mic==='granted'){enterApp()}else if(!S.launch.includes('needed'))S.launch.push('needed')}
function enterApp(){S.phase='app';S.tab='practice';S.launch=[];S.overlays=[];S.alert=null}

const A={
 start(){S.launch.push('allow')},
 back(){if(S.phase==='launch')S.launch.pop();else S.stacks[S.tab].pop()},
 allowAccess(){askCam()},
 ans(d){const[k,v]=d.v.split(':');S.perm[k]=v;S.alert=null;
  if(v==='denied'){finish();return}
  if(k==='cam')askMic();else finish()},
 openSettings(){S.overlays.push({name:'iossettings'})},
 togPerm(d){S.perm[d.k]=S.perm[d.k]==='granted'?'denied':'granted'},
 tryAgain(){S.launch=['getstarted','allow']},
 closeOv(){popOverlay()},
 tab(d){while(S.overlays.length)popOverlay();const t=d.t;if(t===S.tab){S.stacks[t]=[];return}if(S.tab==='tools')leaveTools();S.tab=t},
 profile(){S.overlays.push({name:'profile'})},
 progress(){S.stacks.dashboard.push({name:'progress'})},
 allLessons(){S.stacks.dashboard.push({name:'lessons'})},
 lesson(d){S.stacks[S.tab].push({name:'lesson',id:d.id})},
 ex(d){S.ex[d.id]=!S.ex[d.id]},
 complete(d){if(!S.done.includes(d.id))S.done.push(d.id);toast('Lesson complete')},
 openChord(d){if(S.tab!=='practice'){if(S.tab==='tools')leaveTools();S.tab='practice';S.stacks.practice=[]}S.overlays=S.overlays.filter(o=>o.name!=='chord');S.overlays.push({name:'chord',chord:d.c})},
 help(){S.overlays.push({name:'chord',chord:S.overlays.find(o=>o.name==='live').chord,fromLive:true})},
 pickChord(d){const o=S.overlays.find(o=>o.name==='chord');if(o)o.chord=d.c},
 startLive(d){openLive(d.c)},
 listen(){const L=S.live;L.listening=!L.listening;if(L.listening){L.phase=0;L.pt=Date.now()}else clearTimeout(tick.phase)},
 video(d){S.video={id:d.id,playing:false,t:0};S.overlays.push({name:'video'})},
 vplay(){const V=S.video;const [m,sc]=LES[V.id].dur.split(':').map(Number);if(V.t>=m*60+sc)V.t=0;V.playing=!V.playing},
 pref(d){S.prefs[d.k]=!S.prefs[d.k]},
 resetAsk(){S.alert={sheet:true,t:'Reset progress?',m:'Your lesson progress and practice time will be cleared. This cannot be undone.',b:[{l:'Reset progress',a:'reset',s:'d'},{l:'Cancel',a:'dismiss',s:'b'}]}},
 dismiss(){S.alert=null},
 reset(){S.alert=null;S.done=[];S.time={C:0,D:0,G:0,Em:0};S.ex={};S.last='Em';toast('Progress reset')},
 about(){S.overlays.push({name:'about'})},
 privacy(){S.overlays.push({name:'privacy'})},
 tuneFrom(){S.tab='tools';S.tools.seg='tuner'},
 seg(d){leaveTools();S.tools.seg=d.v},
 tlisten(){S.tuner.on=!S.tuner.on},
 bpm(d){const M=S.metro;M.bpm=Math.max(40,Math.min(220,M.bpm+ +d.v));const r=$('#bpmr');if(r)r.value=M.bpm;$('#bpmv').textContent=M.bpm;if(M.on)metroRun();return 'skip'},
 mtoggle(){const M=S.metro;if(M.on)metroStop();else{M.on=true;metroRun()}}
};
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');if(!t||!$('#phone').contains(t))return;
 const fn=A[t.dataset.a];if(!fn)return;
 if(t.dataset.a==='ex'||t.dataset.a==='togPerm'){/* normal */}
 const r=fn({...t.dataset});if(r==='skip')return;sync(true);
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.tg[data-a]')){e.preventDefault();e.target.click()}});

/* ---------- Scale to fit ---------- */
function fit(){
 const sc=Math.max(.4,Math.min(1,(innerWidth-16)/426,(innerHeight-16)/898));
 $('#phone').style.transform=`scale(${sc})`;
 const w=$('#stagewrap');w.style.width=426*sc+'px';w.style.height=898*sc+'px';
}
addEventListener('resize',fit);fit();
sync(true);
})();
</script>

</body>
</html>
